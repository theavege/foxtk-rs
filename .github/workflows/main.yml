---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  make:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' setup

      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install fox cmake ninja pkgconf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Check Windows archive and CMake setup on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p foxtk-sys --test windows_build_support
          bash '.github/workflows/check-windows-cmake.sh'

      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash '.github/workflows/make.sh' build

      - name: Run FOX runtime tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a cargo test -p foxtk --test runtime

      - name: Build and lint on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --examples
          cargo clippy --release --quiet --examples
          cargo doc --release --no-deps
          cargo fmt --check --all

      - name: Install native dependencies on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pwsh -File '.github/workflows/make.ps1' setup

      - name: Build on Windows
        if: runner.os == 'Windows'
        id: windows_build
        shell: powershell
        run: |
          pwsh -File '.github/workflows/make.ps1' build

      - name: Check CMake cache on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pwsh -File '.github/workflows/make.ps1' cmake-cache-check '${{ steps.windows_build.outputs.foxtk_cmake_build_dir }}'
