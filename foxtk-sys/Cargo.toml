[package]
name = "foxtk-sys"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = { version = "0.72" }

[target.'cfg(target_os = "windows")'.build-dependencies]
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }
zip-extract = "0.1"
glob = "0.3"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3"
